name: Verify all embedded historical Git bundles
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-embedded-bundles.yml"

permissions:
  contents: write

jobs:
  verify:
    if: github.repository == 'ianmaciel7/exams-app-archive'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Recover and verify all 15 embedded bundles independently of original sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_embedded_bundles.py
      - name: Record audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/embedded-bundles-audit.json reports/embedded-bundles-audit.md
          if ! git diff --cached --quiet; then
            git commit -m "test(archive): record 15 embedded bundle integrity checks"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
