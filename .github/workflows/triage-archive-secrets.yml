name: Archive secret candidate triage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/triage-archive-secrets.yml"]
permissions:
  contents: read
jobs:
  triage:
    if: github.repository == 'ianmaciel7/exams-app-archive'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        source: [notes-app]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify historical secret candidates without displaying data
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ matrix.source }}
        run: python scripts/triage_archive_secrets.py "$SOURCE"
