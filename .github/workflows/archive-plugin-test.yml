name: Archive plugin tests
on:
  pull_request:
    paths:
      - "plugins/exams-archive/**"
      - "site/**"
      - "tests/test_archive_plugin.py"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/archive-plugin-test.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-plugin-test.yml"
      - "plugins/exams-archive/**"
      - "tests/test_archive_plugin.py"
      - ".agents/plugins/marketplace.json"
permissions:
  contents: read
jobs:
  stdlib-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_archive_plugin.py -v
      - run: python -m py_compile plugins/exams-archive/scripts/archive_query.py
      - run: node --check site/app.js
      - name: Authenticated archived-index smoke test
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python plugins/exams-archive/scripts/archive_query.py --db "$RUNNER_TEMP/archive.sqlite" sync > "$RUNNER_TEMP/verify-sync.json"
          python plugins/exams-archive/scripts/archive_query.py --db "$RUNNER_TEMP/archive.sqlite" search grafo --limit 4 > "$RUNNER_TEMP/verify-search.json"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"]); a=json.loads((p/"verify-sync.json").read_text()); b=json.loads((p/"verify-search.json").read_text()); assert a["sources"] >= 19 and len(b) >= 1, (a,len(b))'
