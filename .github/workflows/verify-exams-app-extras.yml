name: Verify exams-app full archive, assets, LFS and workflow logs
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: exams-app-extra-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'ianmaciel7/exams-app-archive'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify all Git objects, image files, LFS pointers and CI metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_exams_app_extras.py
      - name: Save compact verification report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/EXAMS-APP-VERIFY.json reports/EXAMS-APP-VERIFY.md
          if ! git diff --cached --quiet; then
            git commit -m 'test(archive): confirm all exams-app Git objects and external payloads'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
