name: Publish legacy artifact release for in-progress checksum verification
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'ianmaciel7/exams-app-archive'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          set -euo pipefail
          mkdir -p verify
          gh release download legacy-ci-artifacts-2026-11-23-bulk -R ianmaciel7/exams-app-archive --pattern BULK-MANIFEST.json --dir verify
          python3 - <<'PY'
          import json
          m=json.load(open('verify/BULK-MANIFEST.json'))
          assert m['complete'] is True
          assert m['expected_artifacts']==m['archived_artifacts']==2883
          assert m['missing_artifacts']==0 and m['failed_downloads']==0
          PY
          gh release edit legacy-ci-artifacts-2026-11-23-bulk -R ianmaciel7/exams-app-archive --draft=false --title "Verified historical CI evidence - 2,883 artifacts"
