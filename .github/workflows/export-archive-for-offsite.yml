name: Export all verified legacy backups for independent off-GitHub storage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/export-archive-for-offsite.yml']
permissions:
  contents: read
jobs:
  core:
    if: github.repository == 'ianmaciel7/exams-app-archive'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download essential source Git bundles, metadata and search index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup/core
          for release in archive-2026-11-23-all-refs exams-app-2026-11-23-complete public-metadata-2026-11-23 index-2026-11-23-exams-complete legacy-github-extras-2026-11-23; do
            mkdir -p "backup/core/$release"
            gh release download "$release" -R ianmaciel7/exams-app-archive --dir "backup/core/$release"
          done
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('backup/core')
          manifest=[]
          for folder in sorted(root.iterdir()):
              data=json.loads(subprocess.check_output(['gh','api','repos/ianmaciel7/exams-app-archive/releases/tags/'+folder.name],text=True))
              assets={a['name']:a for a in data['assets']}
              actual={p.name for p in folder.iterdir() if p.is_file()}
              if actual!=set(assets):raise RuntimeError(f'Asset list mismatch: {folder}: {actual.symmetric_difference(set(assets))}')
              for p in sorted(folder.iterdir()):
                  hash=hashlib.sha256()
                  with p.open('rb') as f:
                      for b in iter(lambda:f.read(1048576),b''):hash.update(b)
                  if hash.hexdigest()!=''.join(assets[p.name]['digest'].split('sha256:')):
                      raise RuntimeError('SHA-256 mismatch: '+str(p))
                  manifest.append({'file':str(p.relative_to(root)),'bytes':p.stat().st_size,'sha256':hash.hexdigest()})
          (root/'OFFSITE-MANIFEST.json').write_text(json.dumps({'files':manifest,'source':'ianmaciel7/exams-app-archive','verified':True},indent=2)+'\n')
          print('VERIFIED',len(manifest),'files; bytes',sum(a['bytes'] for a in manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-core-offsite-2026-11-23
          path: backup/core/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
  evidence:
    if: github.repository == 'ianmaciel7/exams-app-archive'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ['00','01','02','03','04','05','06','07','08','09','10','11','12','13','14','15']
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download and verify immutable CI evidence partition
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          tag=legacy-ci-artifacts-2026-11-23-bulk
          mkdir -p backup/evidence
          gh release download "$tag" -R ianmaciel7/exams-app-archive --pattern "legacy-ci-$SHARD.tar" --dir backup/evidence
          gh release download "$tag" -R ianmaciel7/exams-app-archive --pattern "legacy-ci-$SHARD.manifest.json" --dir backup/evidence
          if [ "$SHARD" = 00 ]; then
            gh release download "$tag" -R ianmaciel7/exams-app-archive --pattern BULK-MANIFEST.json --dir backup/evidence
          fi
          python3 - <<'PY'
          import hashlib,json,os,subprocess,tarfile
          from pathlib import Path
          shard=os.environ['SHARD'];tag='legacy-ci-artifacts-2026-11-23-bulk'
          a=json.loads(subprocess.check_output(['gh','api','repos/ianmaciel7/exams-app-archive/releases/tags/'+tag],text=True))
          digests={x['name']:x['digest'].removeprefix('sha256:') for x in a['assets']}
          for p in Path('backup/evidence').iterdir():
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1048576),b''):h.update(b)
              assert h.hexdigest()==digests[p.name],p.name
          manifest=json.loads(Path(f'backup/evidence/legacy-ci-{shard}.manifest.json').read_text())
          assert manifest['counts']['failed']==0,shard
          with tarfile.open(f'backup/evidence/legacy-ci-{shard}.tar') as t:
              assert len([x for x in t.getmembers() if x.isfile()])==manifest['counts']['saved']
          if shard=='00':
              bulk=json.loads(Path('backup/evidence/BULK-MANIFEST.json').read_text())
              assert bulk['complete'] and bulk['expected_artifacts']==bulk['archived_artifacts']==2883
          print('PARTITION VERIFIED',shard,manifest['counts'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-ci-offsite-${{ matrix.shard }}-2026-11-23
          path: backup/evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
