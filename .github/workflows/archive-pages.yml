name: Archive Pages (public shell only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "previews/loading/**"
      - "previews/error/**"
      - "scripts/build_error_preview.mjs"
      - "scripts/build_loading_preview.mjs"
      - ".github/workflows/archive-pages.yml"
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: exams-archive-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build reviewed React preview
        run: |
          npm install --prefix "$RUNNER_TEMP/preview-deps" --no-save --ignore-scripts react@19.1.1 react-dom@19.1.1 typescript@5.9.3 esbuild@0.25.5
          node scripts/build_loading_preview.mjs "$RUNNER_TEMP/preview-deps" "$RUNNER_TEMP/preview-loading.html"
          node scripts/build_error_preview.mjs "$RUNNER_TEMP/preview-deps" "$RUNNER_TEMP/preview-error.html"
      - name: Assert only public static shell is packaged
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/website"
          cp site/index.html site/style.css site/app.js site/.nojekyll site/llms.txt site/files.html site/files.js "$RUNNER_TEMP/website/"
          cp "$RUNNER_TEMP/preview-loading.html" "$RUNNER_TEMP/website/"
          cp "$RUNNER_TEMP/preview-error.html" "$RUNNER_TEMP/website/"
          test "$(find "$RUNNER_TEMP/website" -type f | wc -l)" -eq 9
          ! grep -RIl -E '(ghp_[[:alnum:]]{20,}|github_pat_|BEGIN [A-Z ]+PRIVATE KEY)' "$RUNNER_TEMP/website"
      - name: Check GitHub Pages availability
        id: check_pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "Pages HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$HTTP_STATUS" = "404" ] || [ "$HTTP_STATUS" = "422" ]; then
            ENABLE_STATUS=$(curl -s -o "$RUNNER_TEMP/pages_enable.json" -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"build_type":"workflow"}')
            echo "Pages Enable HTTP status: $ENABLE_STATUS"
            if [ "$ENABLE_STATUS" = "201" ] || [ "$ENABLE_STATUS" = "200" ]; then
              echo "available=true" >> "$GITHUB_OUTPUT"
            else
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::notice ::GitHub Pages is not available on this private repository ($ENABLE_STATUS - account plan restriction). Static shell validated for offline/local use."
            fi
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::GitHub Pages returned status $HTTP_STATUS; skipping deployment."
          fi
      - if: steps.check_pages.outputs.available == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: steps.check_pages.outputs.available == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/website
      - if: steps.check_pages.outputs.available == 'true'
        name: Wait for uploaded Pages artifact to be visible
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -Eq '^[0-9]+$'; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Uploaded Pages artifact not visible after polling"
          exit 1
      - if: steps.check_pages.outputs.available == 'true'
        name: Deploy safe public shell
        id: deployment
        uses: actions/deploy-pages@v4
