name: Archive Pages (public shell only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/archive-pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: exams-archive-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert only public static shell is packaged
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/website"
          cp site/index.html site/style.css site/app.js site/.nojekyll "$RUNNER_TEMP/website/"
          test "$(find "$RUNNER_TEMP/website" -type f | wc -l)" -eq 4
          ! grep -RIl -E '(ghp_[[:alnum:]]{20,}|github_pat_|BEGIN [A-Z ]+PRIVATE KEY)' "$RUNNER_TEMP/website"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/website
      - name: Deploy safe public shell
        id: deployment
        uses: actions/deploy-pages@v4
