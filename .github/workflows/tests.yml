name: CI tests

on:
  pull_request:
    paths:
      - "scripts/**"
      - "config/**"
      - "docs/references/**"
      - "docs/UI-DESIGN-TOKENS.md"
      - "docs/references/visual-evidence-library/**"
      - "plugins/**"
      - "site/**"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "docs/references/**"
      - "docs/UI-DESIGN-TOKENS.md"
      - "docs/references/visual-evidence-library/**"
      - "plugins/**"
      - "site/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run full test suite (pytest)
        run: python -m pytest tests -v
      - name: Audit explicit public knowledge coverage
        run: python scripts/knowledge_coverage_audit.py --output "$RUNNER_TEMP/knowledge-coverage.json"
      - uses: actions/upload-artifact@v4
        with:
          name: public-knowledge-coverage
          path: ${{ runner.temp }}/knowledge-coverage.json
      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py plugins/*/scripts/*.py
      - name: Check site/app.js syntax
        run: node --check site/app.js

  agent-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional integration dependencies
        run: python -m pip install 'mcp>=1.9,<2' 'playwright>=1.49,<2'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run MCP and browser integration smoke
        run: python tests/smoke_agent_browser.py
      - name: Exercise assessment transition demo in Chromium
        run: python tests/smoke_state_transitions.py
      - name: Render and test canonical token states in Chromium
        run: python tests/smoke_token_colors.py "$RUNNER_TEMP/token-evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-token-browser-evidence
          path: ${{ runner.temp }}/token-evidence/

  component-preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install optional preview dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/preview-deps" --no-save --ignore-scripts react@19.1.1 react-dom@19.1.1 esbuild@0.25.5
          python -m pip install 'playwright>=1.49,<2'
          python -m playwright install --with-deps chromium
      - name: Test real React interaction and screenshot database
        run: python tests/smoke_component_preview.py "$RUNNER_TEMP/preview-deps"

  public-production-retrieval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture production search before scoring
        run: |
          mkdir -p "$RUNNER_TEMP/public-eval"
          mv tests/evaluation/public-labels.json "$RUNNER_TEMP/public-labels.json"
          test ! -e tests/evaluation/public-labels.json
          python scripts/production_retrieval_eval.py run tests/evaluation/public-queries.json "$RUNNER_TEMP/public-eval/capture.json"
      - name: Score the captured rankings separately
        run: |
          python scripts/production_retrieval_eval.py score "$RUNNER_TEMP/public-eval/capture.json" "$RUNNER_TEMP/public-labels.json" "$RUNNER_TEMP/public-eval/score.json"
          cat "$RUNNER_TEMP/public-eval/score.json"
          python scripts/production_retrieval_eval.py diagnostic "$RUNNER_TEMP/public-eval/capture.json"
          python scripts/check_public_evaluation.py "$RUNNER_TEMP/public-eval/capture.json" "$RUNNER_TEMP/public-labels.json" "$RUNNER_TEMP/public-eval/score.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-production-retrieval
          path: ${{ runner.temp }}/public-eval/
