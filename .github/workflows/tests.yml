name: CI tests

on:
  pull_request:
    paths:
      - "scripts/**"
      - "config/**"
      - "docs/references/**"
      - "docs/references/visual-evidence-library/**"
      - "plugins/**"
      - "site/**"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "docs/references/**"
      - "docs/references/visual-evidence-library/**"
      - "plugins/**"
      - "site/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run full test suite (pytest)
        run: python -m pytest tests -v
      - name: Compile Python scripts
        run: python -m py_compile scripts/*.py plugins/*/scripts/*.py
      - name: Check site/app.js syntax
        run: node --check site/app.js

  agent-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional integration dependencies
        run: python -m pip install 'mcp>=1.9,<2' 'playwright>=1.49,<2'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run MCP and browser integration smoke
        run: python tests/smoke_agent_browser.py

  component-preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install optional preview dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/preview-deps" --no-save --ignore-scripts react@19.1.1 react-dom@19.1.1 esbuild@0.25.5
          python -m pip install 'playwright>=1.49,<2'
          python -m playwright install --with-deps chromium
      - name: Test real React interaction and screenshot database
        run: python tests/smoke_component_preview.py "$RUNNER_TEMP/preview-deps"
