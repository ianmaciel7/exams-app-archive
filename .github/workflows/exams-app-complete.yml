name: Preserve every exams-app branch and GitHub metadata
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exams-app-complete.yml'
permissions:
  contents: write
concurrency:
  group: exams-app-complete-archive
  cancel-in-progress: false
jobs:
  preserve-exams-app:
    if: github.repository == 'ianmaciel7/exams-app-archive'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Create and test complete private exams-app archival release
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: python3 scripts/preserve_exams_app_complete.py
      - name: Publish branch inventory and retrieval guide
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/EXAMS-APP-COMPLETE.md inventory/exams-app-branch-files.json manifests/exams-app-complete-2026-11-23.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs(archive): record complete original exams-app branch and PR inventory'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
