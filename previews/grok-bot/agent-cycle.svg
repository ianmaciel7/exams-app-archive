<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170" role="img" aria-labelledby="t"><title id="t">Original agent animation: idle, thinking, working, waiting, blocked, done</title><style>
.b{transform-origin:120px 72px;animation:pose 9s infinite}.ring{transform-origin:120px 72px;animation:orbit 9s linear infinite}.dot{animation:dots 9s infinite}.eye{animation:look 9s infinite}.lbl{font:13px system-ui;fill:#24334b;opacity:0;animation:label 9s infinite}.l2{animation-delay:1.5s}.l3{animation-delay:3s}.l4{animation-delay:4.5s}.l5{animation-delay:6s}.l6{animation-delay:7.5s}
@keyframes label{0%,15%{opacity:1}16.66%,100%{opacity:0}}@keyframes pose{0%,16%{transform:translateY(0)}8%{transform:translateY(-4px)}33%{transform:rotate(-4deg)}42%{transform:translateY(-6px) scale(1.04,.96)}50%,65%{transform:none}70%{transform:translateX(-3px)}73%{transform:translateX(3px)}77%{transform:none}85%{transform:scale(1.12,.90)}90%,100%{transform:none}}@keyframes orbit{0%,32%,51%,100%{opacity:0;transform:rotate(0)}34%,49%{opacity:1;transform:rotate(360deg)}}@keyframes dots{0%,49%,67%,100%{opacity:0}52%,64%{opacity:1}58%{opacity:.3}}@keyframes look{0%,16%,34%,100%{transform:none}25%{transform:translate(5px,-3px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.l1{opacity:1}.ring,.dot{opacity:0}}
</style><rect width="240" height="170" rx="16" fill="#f2f5fa"/><ellipse class="ring" cx="120" cy="72" rx="60" ry="42" stroke="#b68939" stroke-width="3" stroke-dasharray="25 10" fill="none"/><g class="b"><rect x="80" y="32" width="80" height="80" rx="27" fill="#5575bf"/><path d="M89 42 80 26 104 34Z" fill="#5575bf"/><g class="eye" fill="white"><circle cx="108" cy="69" r="5"/><circle cx="132" cy="69" r="5"/><path d="M114 83Q120 87 126 83" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/></g></g><g class="dot" fill="#5575bf"><circle cx="108" cy="124" r="3"/><circle cx="120" cy="124" r="3"/><circle cx="132" cy="124" r="3"/></g><text class="lbl l1" x="120" y="153" text-anchor="middle">Idle</text><text class="lbl l2" x="120" y="153" text-anchor="middle">Thinking</text><text class="lbl l3" x="120" y="153" text-anchor="middle">Working</text><text class="lbl l4" x="120" y="153" text-anchor="middle">Waiting</text><text class="lbl l5" x="120" y="153" text-anchor="middle">Blocked</text><text class="lbl l6" x="120" y="153" text-anchor="middle">Done</text></svg>