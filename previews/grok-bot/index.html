<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent motion lab — original study</title>
<style>
:root{color-scheme:light dark;font:16px system-ui;--accent:#5575bf}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:Canvas;color:CanvasText}main{max-width:740px;margin:auto;padding:32px 20px}h1{font-size:26px;margin:0 0 8px}p{line-height:1.6}small{opacity:.8}section{border:1px solid color-mix(in srgb,CanvasText 20%,transparent);border-radius:18px;padding:24px;margin:20px 0}.stage{text-align:center;min-height:230px;display:grid;place-items:center}svg{width:152px;height:152px;overflow:visible}.body,.eyes,.ring,.dot{transform-box:fill-box;transform-origin:center}.body{fill:var(--accent)}.eyes{fill:#fff}.ring{fill:none;stroke:#b68939;stroke-width:3;stroke-dasharray:30 12;opacity:0}.dot{fill:var(--accent);opacity:0}button{font:inherit;padding:9px 13px;border:1px solid GrayText;background:Canvas;color:CanvasText;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:CanvasText;color:Canvas}button:focus-visible{outline:3px solid #698cf8;outline-offset:3px}.controls{display:flex;flex-wrap:wrap;gap:8px}.state{font-weight:650;font-size:20px;margin:8px}.details{margin-top:16px}
[data-state=idle] .body,[data-state=idle] .eyes{animation:float 2.4s ease-in-out infinite}
[data-state=thinking] .eyes{animation:glance 1.5s ease-in-out infinite}
[data-state=working] .body,[data-state=working] .eyes{animation:bounce 1.2s ease-in-out infinite}
[data-state=working] .ring{opacity:1;animation:spin 1.2s linear infinite}
[data-state=waiting] .dot{opacity:1;animation:pulse 1.4s ease-in-out infinite}
[data-state=waiting] .dot:nth-child(2){animation-delay:.16s}
[data-state=waiting] .dot:nth-child(3){animation-delay:.32s}
[data-state=blocked] .body,[data-state=blocked] .eyes{animation:shake .32s ease-out}
[data-state=done] .body,[data-state=done] .eyes{animation:pop .44s ease-out}
[data-state=blocked]{--accent:#b55e4b}[data-state=done]{--accent:#397c68}
@keyframes float{50%{transform:translateY(-3px)}}@keyframes glance{50%{transform:translate(5px,-3px)}}@keyframes bounce{50%{transform:translateY(-5px) scale(1.02,.96)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.2;transform:scale(.8)}}@keyframes shake{25%,75%{transform:translateX(3px)}50%{transform:translateX(-3px)}}@keyframes pop{35%{transform:scale(1.12,.90)}70%{transform:scale(.96,1.06)}}
.paused *{animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style><main><small>EXTERNAL DESIGN STUDY / ORIGINAL PROTOTYPE</small><h1>Agent motion lab</h1><p>Six lifecycle states inspired by the documented Grok Bot interaction pattern. This is not an official asset or a live AI agent.</p><section id="lab" data-state="idle"><div class="stage"><div><svg viewBox="0 0 128 128" aria-hidden="true"><ellipse class="ring" cx="64" cy="62" rx="54" ry="39"/><g class="body"><rect x="27" y="25" width="74" height="74" rx="24"/><path d="M36 33 27 19 49 26Z"/></g><g class="eyes"><circle cx="53" cy="59" r="5"/><circle cx="76" cy="59" r="5"/><path d="M58 73Q64 77 70 73" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/></g><g><circle class="dot" cx="52" cy="112" r="3"/><circle class="dot" cx="64" cy="112" r="3"/><circle class="dot" cx="76" cy="112" r="3"/></g></svg><div id="status" class="state" role="status" aria-live="polite">Idle</div></div></div><div id="controls" class="controls"></div><div class="details"><button id="pause" aria-pressed="false">Pause animation</button> <button id="show" aria-expanded="false" aria-controls="detail">Show activity</button><p id="detail" hidden>Available for a new task.</p></div></section><p><a href="agent-cycle.svg">Animated SVG</a> · <a href="agent-cycle.gif">GIF</a> · <a href="states.svg">State sheet</a> · <a href="https://x.ai/news/designing-grok-bot">Official design reference</a></p></main>
<script>
const states={idle:"Available for a new task.",thinking:"Preparing a search plan.",working:"Indexing question files.",waiting:"Waiting for the import service.",blocked:"Needs permission to read the file.",done:"Import completed in this simulation."};const lab=document.querySelector("#lab"),status=document.querySelector("#status"),detail=document.querySelector("#detail"),controls=document.querySelector("#controls"),pause=document.querySelector("#pause"),show=document.querySelector("#show");let paused=false;const label=s=>s[0].toUpperCase()+s.slice(1);function setState(s){if(!Object.hasOwn(states,s))return;lab.dataset.state=s;status.textContent=label(s);detail.textContent=states[s];for(const b of controls.children)b.setAttribute("aria-pressed",String(b.dataset.state===s));}for(const s of Object.keys(states)){const b=document.createElement("button");b.type="button";b.dataset.state=s;b.textContent=label(s);b.addEventListener("click",()=>setState(s));controls.append(b)}setState("idle");function sync(){lab.classList.toggle("paused",paused||document.hidden)}pause.addEventListener("click",()=>{paused=!paused;pause.setAttribute("aria-pressed",String(paused));pause.textContent=paused?"Resume animation":"Pause animation";sync()});show.addEventListener("click",()=>{detail.hidden=!detail.hidden;show.setAttribute("aria-expanded",String(!detail.hidden));show.textContent=detail.hidden?"Show activity":"Hide activity"});document.addEventListener("visibilitychange",sync);
</script></html>
