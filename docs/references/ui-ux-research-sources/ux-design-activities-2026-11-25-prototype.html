<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exemplo lo-fi interativo — sessão de questões</title><style>body{font:16px system-ui;margin:0;background:#f5f5f5;color:#222}main{max-width:40rem;margin:2rem auto;padding:1.25rem;background:white;border:1px solid #999}fieldset{border:0;padding:0;margin:1rem 0}legend{font-weight:600}label{display:flex;gap:.7rem;padding:.8rem;border:1px solid #aaa;margin:.5rem 0}button{font:inherit;padding:.65rem 1rem;min-height:44px}button:focus-visible,input:focus-visible{outline:3px solid #254f9c;outline-offset:2px}#feedback{min-height:1.5rem}small{display:block;margin-top:1rem}</style><main><h1>Questões</h1><p id="progress"></p><form><fieldset><legend id="q"></legend><div id="options"></div></fieldset><button id="submit" type="submit">Responder</button> <button type="button" id="next" hidden>Próxima</button></form><p id="feedback" role="status" aria-live="polite"></p><label><input type="checkbox" id="fail"> Simular falha na próxima resposta</label><small>Dados fictícios. Sem backend, autenticação ou persistência. Demonstra seleção, feedback, recuperação e reinício. Não é teste de conformidade WCAG.</small></main><script>const qs=[['O que a IA organiza?',['Informações e destinos','Apenas cores','Apenas o banco de dados'],0],['Um wireframe pode ser interativo?',['Sim','Não'],0]];let i=0;const q=document.querySelector('#q'),opts=document.querySelector('#options'),status=document.querySelector('#feedback'),submit=document.querySelector('#submit'),next=document.querySelector('#next'),fail=document.querySelector('#fail');function render(){document.querySelector('#progress').textContent='Questão '+(i+1)+' de '+qs.length;q.textContent=qs[i][0];opts.replaceChildren(...qs[i][1].map((t,j)=>{const label=document.createElement('label'),r=document.createElement('input');r.type='radio';r.name='answer';r.value=j;r.required=j===0;label.append(r,t);return label}));status.textContent='';submit.disabled=false;next.hidden=true}document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const r=opts.querySelector('input:checked');if(!r)return;if(fail.checked){fail.checked=false;status.textContent='Falha simulada. Sua seleção foi preservada. Tente novamente.';return}status.textContent=Number(r.value)===qs[i][2]?'Resposta correta.':'Resposta incorreta. Resposta correta: '+qs[i][1][qs[i][2]];opts.querySelectorAll('input').forEach(x=>x.disabled=true);submit.disabled=true;next.hidden=false;next.textContent=i===qs.length-1?'Reiniciar':'Próxima';next.focus()});next.addEventListener('click',()=>{i=(i+1)%qs.length;render();opts.querySelector('input').focus()});render()</script></html>
