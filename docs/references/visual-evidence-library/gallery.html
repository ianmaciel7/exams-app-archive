<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Visual evidence library</title><style>body{font:15px system-ui;max-width:1200px;margin:32px auto;padding:0 16px;color:#222;background:#fafafa}input,select{font:inherit;padding:10px;max-width:100%;margin:4px}#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}article{background:white;border:1px solid #ddd;border-radius:10px;padding:14px;overflow-wrap:anywhere}img,video{width:100%;max-height:230px;object-fit:contain}small{display:block;color:#555}a{color:#1756a3}</style><h1>Visual evidence library</h1><p>Archived bytes and link-only references are distinct. Sampled timelines show decoded frames, not verified semantic action labels. Complete sources remain linked.</p><label>Search <input id="q" type="search"></label><label>Type <select id="kind"><option value="">All</option><option>image</option><option>gif</option><option>video</option><option>demo</option><option>documentation</option></select></label><label>Availability <select id="status"><option value="">All</option><option>archived-blob-verified</option><option>link-only</option></select></label><p id="count" role="status"></p><div id="results"></div><script>const q=document.querySelector('#q'),kind=document.querySelector('#kind'),status=document.querySelector('#status'),results=document.querySelector('#results'),count=document.querySelector('#count');let records=[];function add(parent,tag,text){const el=document.createElement(tag);if(text)el.textContent=text;parent.append(el);return el}function render(){results.replaceChildren();const terms=q.value.toLowerCase().trim().split(/\s+/).filter(Boolean);const found=records.filter(r=>(!kind.value||r.kind===kind.value)&&(!status.value||r.status===status.value)&&terms.every(t=>JSON.stringify(r).toLowerCase().includes(t)));count.textContent=found.length+' references';for(const r of found){const a=add(results,'article');add(a,'h2',r.title);add(a,'small',r.product+' · '+r.kind+' · '+r.status);if(r.segment_evidence){const e=r.segment_evidence;add(a,'p','Timeline: '+e.segment.start_seconds+'–'+e.segment.end_seconds+' s / '+e.duration_seconds+' s');add(a,'small','Semantic review: '+e.semantic_review);for(const f of e.keyframes){if(/^media\/segments\/[a-zA-Z0-9_.-]+$/.test(f.path)){const im=add(a,'img');im.src=f.path;im.alt=r.title+' at '+f.timestamp_seconds+' s';im.loading='lazy';add(a,'small',f.timestamp_seconds+' s')}}if(e.clip&&/^media\/segments\/[a-zA-Z0-9_.-]+$/.test(e.clip.path)){const v=add(a,'video');v.src=e.clip.path;v.controls=true;v.preload='none';v.muted=true}}else if(r.path&&/^media\/[a-z0-9-]+\/[a-zA-Z0-9_.-]+$/.test(r.path)){if(r.kind==='video'){const v=add(a,'video');v.src=r.path;v.controls=true;v.preload='none'}else{const im=add(a,'img');im.src=r.path;im.alt=r.title;im.loading='lazy'}const dl=add(a,'a','Open archived file');dl.href=r.path}add(a,'p',r.keywords.join(' · '));const link=add(a,'a','Original source');if(r.source_url.startsWith('https://'))link.href=r.source_url;link.rel='noopener noreferrer';add(a,'small',r.license)}}[q,kind,status].forEach(x=>x.addEventListener('input',render));fetch('manifest.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(m=>{records=m.records;render()}).catch(e=>{count.textContent='Manifest unavailable: '+e.message+'; serve over HTTP.'});</script></html>
